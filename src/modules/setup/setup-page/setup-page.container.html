<div class="info">
  <div class="loading-container">
    @if (loading()) {
    <mat-progress-spinner color="primary" mode="indeterminate" [value]="0"> </mat-progress-spinner>
    }
    <mat-icon class="doc-icon" color="primary">description</mat-icon>
  </div>
</div>

<form class="info full-width">
  <mat-form-field appearance="outline" class="readonly full-width">
    <mat-label>Spreadsheet</mat-label>
    <input [name]="spreadsheetIdField" matInput [ngModel]="spreadsheetId | async" readonly
      placeholder="Not picked yet" />
    <mat-icon matSuffix>description</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="readonly">
    <mat-label>Data Sheet id</mat-label>
    <input [name]="sheetField" matInput [ngModel]="$safeNavigationMigration((sheet$ | async)?.id)" readonly />
    <mat-icon [class]="sheetDone() ? 'icon-green' : 'icon-gray'" matPrefix>task</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" class="readonly">
    <mat-label>Categories Sheet id</mat-label>
    <input [name]="categoriesSheetIdField" matInput [ngModel]="categoriesSheetId | async" readonly />
    <mat-icon [class]="categoriesSheetDone() ? 'icon-green' : 'icon-gray'" matPrefix>task</mat-icon>
  </mat-form-field>

  <button mat-flat-button color="primary" (click)="checkSetup(state())" [disabled]="loading()">
    {{ state() === 'check document' ? 'Choose spreadsheet' : state() }}
  </button>
</form>
